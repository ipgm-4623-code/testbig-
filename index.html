<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistem Pemarkahan IPG — MPU2082</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --primary: #185FA5;
    --primary-light: #E6F1FB;
    --primary-mid: #378ADD;
    --success: #3B6D11;
    --success-light: #EAF3DE;
    --warning: #854F0B;
    --warning-light: #FAEEDA;
    --danger: #A32D2D;
    --danger-light: #FCEBEB;
    --purple: #534AB7;
    --purple-light: #EEEDFE;
    --teal: #0F6E56;
    --teal-light: #E1F5EE;
    --gray-100: #F1EFE8;
    --gray-200: #D3D1C7;
    --gray-400: #888780;
    --gray-600: #5F5E5A;
    --gray-800: #444441;
    --text-primary: #1a1a1a;
    --text-secondary: #5F5E5A;
    --bg: #f7f6f3;
    --bg-card: #ffffff;
    --border: #e0ded8;
    --radius: 10px;
    --radius-lg: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.6;
  }

  #app { display: flex; min-height: 100vh; }

  .sidebar {
    width: 230px;
    background: var(--bg-card);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    position: fixed;
    height: 100vh;
    z-index: 100;
  }

  .sidebar-brand { padding: 18px 16px 14px; border-bottom: 1px solid var(--border); }
  .sidebar-brand h1 { font-size: 14px; font-weight: 600; color: var(--primary); line-height: 1.3; }
  .sidebar-brand p { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
  .sidebar-user { padding: 10px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }

  .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0; overflow: hidden; background-clip: padding-box; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; border-radius: 50%; }

  .sidebar-user-info .name { font-size: 12px; font-weight: 600; }
  .sidebar-user-info .role { font-size: 11px; color: var(--text-secondary); }
  .sidebar-nav { flex: 1; padding: 8px 8px; overflow-y: auto; }

  .nav-item { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 7px; cursor: pointer; font-size: 13px; color: var(--text-secondary); transition: background 0.15s, color 0.15s; margin-bottom: 1px; }
  .nav-item:hover { background: var(--gray-100); color: var(--text-primary); }
  .nav-item.active { background: var(--primary-light); color: var(--primary); font-weight: 500; }
  .sidebar-footer { padding: 12px 16px; border-top: 1px solid var(--border); }

  .btn-logout { width: 100%; padding: 7px 12px; border-radius: 7px; border: 1px solid var(--border); background: transparent; color: var(--text-secondary); font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: background 0.15s; }
  .btn-logout:hover { background: var(--danger-light); color: var(--danger); border-color: #f0c0c0; }

  .main { margin-left: 230px; flex: 1; min-height: 100vh; display: flex; flex-direction: column; }
  .topbar { background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
  .topbar h2 { font-size: 16px; font-weight: 600; }
  .content { padding: 24px; flex: 1; }

  #screen-auth { min-height: 100vh; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 20px; }
  .auth-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 32px; width: 100%; max-width: 400px; }
  .auth-logo { text-align: center; margin-bottom: 24px; }
  .auth-logo h1 { font-size: 18px; font-weight: 600; color: var(--text-primary); }
  .auth-logo p { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-bottom: 5px; }
  .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; background: var(--bg-card); color: var(--text-primary); outline: none; }

  .btn { padding: 9px 18px; border-radius: var(--radius); border: 1px solid var(--border); font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all 0.15s; text-decoration: none; color: var(--text-primary); background: var(--bg-card); }
  .btn:hover { background: var(--gray-100); }
  .btn-primary { background: var(--primary); color: white; border-color: var(--primary); }
  .btn-block { width: 100%; justify-content: center; }
  .btn-sm { padding: 5px 12px; font-size: 12px; }
  .btn-xs { padding: 3px 8px; font-size: 11px; }
  .btn-success { background: var(--success); color: white; border-color: var(--success); }
  .btn-danger { background: var(--danger); color: white; border-color: var(--danger); }

  .auth-tabs { display: flex; margin-bottom: 20px; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .auth-tab { flex: 1; padding: 8px; text-align: center; font-size: 13px; font-weight: 500; cursor: pointer; background: transparent; border: none; color: var(--text-secondary); }
  .auth-tab.active { background: var(--primary); color: white; }

  .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 16px; }
  .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .card-title { font-size: 14px; font-weight: 600; color: var(--text-primary); }
  .card-subtitle { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }

  .stat-card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .stat-card .label { font-size: 11px; color: var(--text-secondary); font-weight: 500; text-transform: uppercase; }
  .stat-card .value { font-size: 22px; font-weight: 600; color: var(--text-primary); }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th { background: var(--gray-100); padding: 9px 12px; text-align: left; font-weight: 600; font-size: 11px; color: var(--text-secondary); border-bottom: 1px solid var(--border); }
  tbody tr { border-bottom: 1px solid var(--border); }
  tbody td { padding: 9px 12px; vertical-align: middle; }

  .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; }
  .badge-blue { background: var(--primary-light); color: var(--primary); }
  .badge-green { background: var(--success-light); color: var(--success); }
  .badge-amber { background: var(--warning-light); color: var(--warning); }
  .badge-red { background: var(--danger-light); color: var(--danger); }
  .badge-gray { background: var(--gray-100); color: var(--gray-600); }

  .mark-input { width: 75px; padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; text-align: center; }
  .alert { padding: 10px 14px; border-radius: var(--radius); font-size: 13px; margin-bottom: 12px; display: flex; gap: 8px; }
  .alert-danger { background: var(--danger-light); color: var(--danger); border: 1px solid #f0c0c0; }
  .alert-success { background: var(--success-light); color: var(--success); border: 1px solid #c0de97; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 999; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal { background: var(--bg-card); border-radius: var(--radius-lg); width: 100%; max-width: 540px; max-height: 90vh; overflow-y: auto; padding: 24px; }
  .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .modal-close { width: 28px; height: 28px; border: 1px solid var(--border); border-radius: 6px; background: transparent; cursor: pointer; font-size: 16px; }

  .hidden { display: none !important; }
  .gred-A { color: var(--success); font-weight: 600; }
  .gred-B { color: var(--primary); font-weight: 600; }
  .gred-C { color: var(--warning); font-weight: 600; }
  .gred-F { color: var(--danger); font-weight: 600; }
  .notification { position: fixed; bottom: 20px; right: 20px; background: #1a1a1a; color: white; padding: 10px 16px; border-radius: var(--radius); font-size: 13px; z-index: 9999; }
  
  .merit-btn-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; margin-top: 10px; }
  
  .sub-tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 2px solid var(--border); }
  .sub-tab { padding: 10px 16px; cursor: pointer; font-weight: 500; color: var(--text-secondary); border-bottom: 3px solid transparent; }
  .sub-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
  
  .member-chip { display: inline-block; padding: 4px 10px; background: var(--gray-100); border: 1px solid var(--border); border-radius: 20px; font-size: 12px; margin: 2px; font-weight: 500; }
</style>
</head>
<body>

<div id="screen-auth">
  <div class="auth-card">
    <div class="auth-logo">
      <h1>Sistem Pentaksiran IPG</h1>
      <p>MPU2082 — Pengurusan Kebudayaan & Perkhemahan</p>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchAuthTab('pensyarah')">Pensyarah</button>
      <button class="auth-tab" onclick="switchAuthTab('pelajar')">Pelajar</button>
    </div>
    <div id="auth-pensyarah-form">
      <div class="form-group"><label>E-mel Pensyarah</label><input type="email" id="auth-email" placeholder="Masukkan e-mel berdaftar"/></div>
      <div class="form-group"><label>Kata Laluan</label><input type="password" id="auth-password" placeholder="Masukkan kata laluan"/></div>
    </div>
    <div id="auth-pelajar-form" class="hidden">
      <div class="form-group"><label>Nombor Kad Pengenalan Pelajar</label><input type="text" id="auth-nokp" placeholder="cth: 030924080985"/></div>
    </div>
    <div id="auth-error" class="alert alert-danger hidden"><span>⚠</span><span id="auth-error-msg">Maklumat tidak sah</span></div>
    <div id="auth-loading" style="display:none; text-align:center; font-size:12px; color:var(--primary); margin:8px 0;">Menghubungkan ke server Google Sheets...</div>
    <button class="btn btn-primary btn-block" onclick="doLogin()">Log Masuk Selamat</button>
  </div>
</div>

<div id="app" class="hidden">
  <aside class="sidebar">
    <div class="sidebar-brand"><h1>Sistem Bersepadu</h1><p>MPU2082 | PB & Merit</p></div>
    <div class="sidebar-user" id="sidebar-user-info"></div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer"><button class="btn-logout" onclick="doLogout()">Log Keluar</button></div>
  </aside>
  <main class="main">
    <div class="topbar"><h2 id="page-title">Papan Pemuka</h2><div id="topbar-right"></div></div>
    <div class="content" id="main-content"></div>
  </main>
</div>

<div id="modal-container"></div>
<div id="notification-bar" style="display:none" class="notification"></div>

<script>
// Pautan Kekunci API Google Apps Script Deployment Aktif Anda
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxudOo_cl0mBKtY3GQrCEITD1Dfv1Zv5x7wYyUOcfEdmGQUD3iie0arlSyebgJ6PLm0/exec';

let currentUser = null, currentRole = null, currentScreen = null, currentPelajar = null;
let markahDB = {}, biodataDB = {}, activeMeritTab = 'Individu';
let pelajarDBList = []; // Senarai Pelajar Dimuat Turun Secara Dinamik dari Google Sheets

async function callGAS(action, payload = {}) {
  try {
    const params = new URLSearchParams({ action, payload: JSON.stringify(payload) });
    const resp = await fetch(GAS_URL + '?' + params.toString(), { method: 'GET', redirect: 'follow' });
    return await resp.json();
  } catch (e) { console.error(e); return null; }
}

async function callGASPost(action, payload = {}) {
  try {
    const body = new FormData();
    body.append('action', action);
    body.append('payload', JSON.stringify(payload));
    const resp = await fetch(GAS_URL, { method: 'POST', body, redirect: 'follow' });
    return await resp.json();
  } catch (e) { console.error(e); return null; }
}

function switchAuthTab(tab) {
  document.getElementById('auth-pensyarah-form').classList.toggle('hidden', tab !== 'pensyarah');
  document.getElementById('auth-pelajar-form').classList.toggle('hidden', tab !== 'pelajar');
  document.querySelectorAll('.auth-tab').forEach((t, i) => t.classList.toggle('active', (i===0 && tab==='pensyarah') || (i===1 && tab==='pelajar')));
}

// PROSES PENGESAHAN: Data disemak terus ke Sheets di bahagian server backend (Tiada data sulit dalam HTML)
async function doLogin() {
  const isP = !document.getElementById('auth-pensyarah-form').classList.contains('hidden');
  let payload = {};
  
  if (isP) {
    payload = {
      type: 'pensyarah',
      email: document.getElementById('auth-email').value.trim(),
      password: document.getElementById('auth-password').value.trim()
    };
  } else {
    payload = {
      type: 'pelajar',
      nokp: document.getElementById('auth-nokp').value.trim()
    };
  }
  
  if((isP && (!payload.email || !payload.password)) || (!isP && !payload.nokp)) {
    alert("Sila isi maklumat yang diperlukan."); return;
  }
  
  document.getElementById('auth-error').classList.add('hidden');
  document.getElementById('auth-loading').style.display = 'block';
  
  const res = await callGASPost('login', payload);
  document.getElementById('auth-loading').style.display = 'none';
  
  if (res && res.ok) {
    currentUser = res.user;
    currentRole = res.type;
    if (currentRole === 'pelajar') currentPelajar = res.user;
    
    // Muat turun data dinamik pelajar serta-merta dari Google Sheets
    await loadAllDataFromServer();
    
    document.getElementById('screen-auth').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    
    if (currentRole === 'pensyarah') buildSidebarPensyarah(); else buildSidebarPelajar();
  } else {
    document.getElementById('auth-error-msg').textContent = res ? res.error : "Ralat sambungan pangkalan data.";
    document.getElementById('auth-error').classList.remove('hidden');
  }
}

async function loadAllDataFromServer() {
  const pRes = await callGAS('getPelajarList');
  if (pRes && pRes.ok) {
    pelajarDBList = pRes.data;
  } else {
    console.error("Gagal mendapatkan senarai pelajar");
  }
  const mRes = await callGAS('getAllMarkah'); if (mRes?.ok) mRes.data.forEach(m => markahDB[m.nokp] = m);
  const bRes = await callGAS('getAllBiodata'); if (bRes?.ok) bRes.data.forEach(b => biodataDB[b.nokp] = b);
}

function doLogout() { location.reload(); }

function buildSidebarPensyarah() {
  document.getElementById('sidebar-user-info').innerHTML = `<div class='avatar'><span>P</span></div><div><div class='name'>${currentUser.nama}</div><div class='role'>Pensyarah</div></div>`;
  const nav = [
    { label: 'Papan Pemuka', screen: 'dashboard' },
    { label: 'Rekod Markah Mentah', screen: 'markah-entry' },
    { label: 'Sistem Merit Demerit', screen: 'merit-demerit' },
    { label: 'Laporan Keseluruhan', screen: 'laporan' }
  ];
  document.getElementById('sidebar-nav').innerHTML = nav.map(n => `<div class="nav-item" id="nav-${n.screen}" onclick="navigateTo('${n.screen}')"><span>${n.label}</span></div>`).join('');
  navigateTo('dashboard');
}

function buildSidebarPelajar() {
  document.getElementById('sidebar-user-info').innerHTML = `<div class='avatar'><span>M</span></div><div><div class='name'>${currentUser.nama}</div><div class='role'>Pelajar</div></div>`;
  const nav = [{ label: 'Profil & Rekod Merit', screen: 'pelajar-profile' }];
  document.getElementById('sidebar-nav').innerHTML = nav.map(n => `<div class="nav-item" id="nav-${n.screen}" onclick="navigateTo('${n.screen}')"><span>${n.label}</span></div>`).join('');
  navigateTo('pelajar-profile');
}

function navigateTo(screen) {
  currentScreen = screen;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  if (document.getElementById('nav-' + screen)) document.getElementById('nav-' + screen).classList.add('active');
  
  if (screen === 'dashboard') renderDashboard();
  if (screen === 'markah-entry') renderMarkahEntry();
  if (screen === 'merit-demerit') renderMeritDemerit();
  if (screen === 'laporan') renderLaporan();
  if (screen === 'pelajar-profile') renderPelajarProfile();
}

function notify(msg, type = 'success') {
  const b = document.getElementById('notification-bar');
  b.textContent = msg; b.style.display = 'block';
  b.style.background = type === 'success' ? '#3B6D11' : '#A32D2D';
  setTimeout(() => b.style.display = 'none', 3000);
}

function renderDashboard() {
  document.getElementById('main-content').innerHTML = `
    <div class="grid-3">
      <div class="stat-card"><div class="label">Jumlah Pelajar Aktif (Live)</div><div class="value">${pelajarDBList.length}</div></div>
      <div class="stat-card"><div class="label">Siri Kursus</div><div class="value">MPU2082</div></div>
      <div class="stat-card"><div class="label">Tahun Pentaksiran</div><div class="value">2026</div></div>
    </div><br>
    <div class="card">
      <div class="card-title">Selamat Datang ke Sistem Pentaksiran Bersepadu IPG</div>
      <p class="text-secondary">Sistem pengiraan wajaran komponen Pentaksiran Berterusan (PB) dan rekod Merit Demerit Perkhemahan masa nyata.</p>
    </div>`;
}

function renderMarkahEntry() {
  document.getElementById('main-content').innerHTML = `
    <div class="card">
      <div class="card-header"><div class="card-title">Kemasukan Markah Mentah PB (0-100)</div>
      <button class="btn btn-success btn-sm" onclick="saveAllMarkah()">Simpan Semua Markah</button></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Nama Pelajar</th><th>Kuiz (Mentah)</th><th>HP4 (Mentah)</th><th>HP5 (Mentah)</th><th>HP3 (Mentah)</th><th>HP8 (Mentah)</th><th>Wajaran (100%)</th><th>Gred</th></tr>
          </thead>
          <tbody id="markah-tbody"></tbody>
        </table>
      </div>
    </div>`;

  document.getElementById('markah-tbody').innerHTML = pelajarDBList.map(p => {
    const m = markahDB[p.nokp] || {};
    const k = parseFloat(m.kuiz)||0; const h4 = parseFloat(m.hp4)||0; const h5 = parseFloat(m.hp5)||0; const h3 = parseFloat(m.hp3)||0; const h8 = parseFloat(m.hp8)||0;
    const totalWajaran = (k*0.1) + (h4*0.3) + (h5*0.3) + (h3*0.15) + (h8*0.15);
    
    return `<tr>
      <td><b>${p.nama}</b><br><small class="badge badge-gray">${p.kelas}</small></td>
      <td><input class="mark-input" data-nokp="${p.nokp}" data-key="kuiz" type="number" min="0" max="100" value="${m.kuiz||''}" oninput="liveCalcWajaran('${p.nokp}')"></td>
      <td><input class="mark-input" data-nokp="${p.nokp}" data-key="hp4" type="number" min="0" max="100" value="${m.hp4||''}" oninput="liveCalcWajaran('${p.nokp}')"></td>
      <td><input class="mark-input" data-nokp="${p.nokp}" data-key="hp5" type="number" min="0" max="100" value="${m.hp5||''}" oninput="liveCalcWajaran('${p.nokp}')"></td>
      <td><input class="mark-input" data-nokp="${p.nokp}" data-key="hp3" type="number" min="0" max="100" value="${m.hp3||''}" oninput="liveCalcWajaran('${p.nokp}')"></td>
      <td><input class="mark-input" data-nokp="${p.nokp}" data-key="hp8" type="number" min="0" max="100" value="${m.hp8||''}" oninput="liveCalcWajaran('${p.nokp}')"></td>
      <td><strong id="wajaran-${p.nokp}">${totalWajaran.toFixed(2)}%</strong></td>
      <td><span id="gred-${p.nokp}" class="gred-B">—</span></td>
    </tr>`;
  }).join('');
  pelajarDBList.forEach(p => liveCalcWajaran(p.nokp));
}

function liveCalcWajaran(nokp) {
  const inputs = document.querySelectorAll(`.mark-input[data-nokp="${nokp}"]`);
  let m = {}; inputs.forEach(i => m[i.dataset.key] = parseFloat(i.value)||0);
  const total = (m.kuiz*0.1) + (m.hp4*0.3) + (m.hp5*0.3) + (m.hp3*0.15) + (m.hp8*0.15);
  document.getElementById('wajaran-' + nokp).textContent = total.toFixed(2) + '%';
  let gred = 'F'; if(total>=90) gred='A+'; else if(total>=80) gred='A'; else if(total>=75) gred='A-'; else if(total>=70) gred='B+'; else if(total>=65) gred='B'; else if(total>=40) gred='D';
  document.getElementById('gred-' + nokp).textContent = gred;
}

async function saveAllMarkah() {
  const rows = [];
  document.querySelectorAll('.mark-input').forEach(i => {
    let exist = rows.find(r => r.nokp === i.dataset.nokp);
    if(!exist) {
      const p = pelajarDBList.find(x => x.nokp === i.dataset.nokp);
      exist = { nokp: i.dataset.nokp, nama: p.nama, kelas: p.kelas, agiliran: p.agiliran, kuiz: null, hp4: null, hp5: null, hp3: null, hp8: null };
      rows.push(exist);
    }
    exist[i.dataset.key] = i.value !== '' ? parseFloat(i.value) : null;
  });
  const res = await callGASPost('saveBatchMarkah', { rows });
  if(res?.ok) notify('Semua markah mentah dan pengiraan wajaran induk berjaya disimpan!');
}

  document.getElementById('main-content').innerHTML = `

function switchMeritView(type) {
  activeMeritTab = type;
  document.getElementById('panel-merit-individu').classList.toggle('hidden', type !== 'Individu');
  document.getElementById('panel-merit-kumpulan').classList.toggle('hidden', type !== 'Kumpulan');
  document.getElementById('st-individu').classList.toggle('active', type === 'Individu');
  document.getElementById('st-kumpulan').classList.toggle('active', type === 'Kumpulan');
  document.getElementById('box-merit-history-log').classList.add('hidden');
  document.getElementById('action-merit-individu').classList.add('hidden');
  document.getElementById('action-merit-kumpulan').classList.add('hidden');
  document.getElementById('preview-ahli-kumpulan-box').classList.add('hidden');
}

function filterStudentByClass() {
  const cls = document.getElementById('sel-kelas-individu').value;
  const select = document.getElementById('sel-nama-individu');
  if(!cls) { select.innerHTML = '<option value="">— Sila Pilih Kelas Dahulu —</option>'; return; }
  
  const filtered = pelajarDBList.filter(p => p.kelas === cls);
  select.innerHTML = '<option value="">— Sila Pilih Pelajar —</option>' + filtered.map(p => `<option value="${p.nokp}">${p.nama}</option>`).join('');
}

async function loadStudentIndividualMerit() {
  const nokp = document.getElementById('sel-nama-individu').value;
  if(!nokp) { document.getElementById('action-merit-individu').classList.add('hidden'); document.getElementById('box-merit-history-log').classList.add('hidden'); return; }
  
  document.getElementById('action-merit-individu').classList.remove('hidden');
  document.getElementById('box-merit-history-log').classList.remove('hidden');
  
  const res = await callGAS('getMeritRecords', { nokp });
  if(res?.ok) {
    document.getElementById('text-score-summary').innerHTML = `Jumlah Skor Semasa Pelajar: <span class="badge badge-blue">${res.totalScore} Mata</span>`;
    renderHistoryTable(res.data);
  }
}

function filterGroupByKumpulan() {
  const cls = document.getElementById('sel-kelas-kumpulan').value;
  const grp = document.getElementById('sel-no-kumpulan').value;
  if(!cls || !grp) {
    document.getElementById('preview-ahli-kumpulan-box').classList.add('hidden');
    document.getElementById('action-merit-kumpulan').classList.add('hidden');
    return;
  }
  const matchingStudents = pelajarDBList.filter(p => {
    const bio = biodataDB[p.nokp] || {};
    return p.kelas === cls && bio.kumpulan === grp;
  });
  const container = document.getElementById('container-ahli-chips');
  if(matchingStudents.length === 0) {
    container.innerHTML = '<span style="color: var(--danger); font-size:13px;">⚠ Tiada ahli ditemui dalam pangkalan data untuk kelas & kumpulan ini. Pastikan pelajar telah melengkapkan nombor kumpulan di profil mereka.</span>';
    document.getElementById('action-merit-kumpulan').classList.add('hidden');
  } else {
    container.innerHTML = matchingStudents.map(p => `<span class="member-chip">👤 ${p.nama}</span>`).join('');
    document.getElementById('action-merit-kumpulan').classList.remove('hidden');
  }
  document.getElementById('preview-ahli-kumpulan-box').classList.remove('hidden');
}

function renderHistoryTable(data) {
  const tbody = document.getElementById('tbody-merit-history');
  if(!data || data.length === 0) {
    tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted">Tiada sebarang rekod ditemui pada lembaran akaun pelajar ini.</td></tr>`;
    return;
  }
  tbody.innerHTML = data.map(d => `<tr><td><small>${d.timestamp}</small></td><td>${d.kategori}</td><td><span class="badge ${d.jenis==='Merit'?'badge-green':'badge-red'}">${d.jenis}</span></td><td>${d.perkara}</td><td><b>${d.mata > 0 ? '+' + d.mata : d.mata}</b></td></tr>`).join('');
}

async function processAddMeritAction(modul, kategori, jenis, perkara, mata) {
  if (modul === 'Individu') {
    const nokp = document.getElementById('sel-nama-individu').value;
    const p = pelajarDBList.find(x => x.nokp === nokp);
    const payload = { nokp: p.nokp, nama: p.nama, kelas: p.kelas, modul, kategori, jenis, perkara, mata, oleh: currentUser.nama };
    const res = await callGASPost('saveMeritItem', payload);
    if(res?.ok) { notify('Catatan Merit Individu Berjaya Disimpan!'); loadStudentIndividualMerit(); }
  } else {
    const cls = document.getElementById('sel-kelas-kumpulan').value;
    const grp = document.getElementById('sel-no-kumpulan').value;
    const matchingStudents = pelajarDBList.filter(p => {
      const bio = biodataDB[p.nokp] || {};
      return p.kelas === cls && bio.kumpulan === grp;
    });
    if(matchingStudents.length === 0) { alert('Tiada ahli kumpulan aktif untuk dihantar.'); return; }
    const records = matchingStudents.map(p => ({ nokp: p.nokp, nama: p.nama, kelas: p.kelas }));
    const payload = { isBatch: true, records: records, modul, kategori, jenis, perkara, mata, oleh: currentUser.nama };
    const res = await callGASPost('saveMeritItem', payload);
    if(res?.ok) { notify('Merit/Demerit Kumpulan Berjaya Diagihkan Kepada Semua Ahli Sekaligus!'); filterGroupByKumpulan(); }
  }
}

function openNewMeritForm(modulContext) {
  document.getElementById('modal-container').innerHTML = `
    <div class="modal-overlay">
      <div class="modal">
        <div class="modal-header"><h3>[ + TAMBAH PENILAIAN ITEM KHAS BARU ]</h3><button class="modal-close" onclick="closeModal()">×</button></div>
        <div class="form-group"><label>Modul Terlibat</label><input type="text" id="modal-modul" value="${modulContext}" readonly style="background:#eee;"></div>
        <div class="form-group"><label>Jenis Item</label><select id="modal-jenis"><option value="Merit">Merit (+)</option><option value="Demerit">Demerit (-)</option></select></div>
        <div class="form-group"><label>Nyatakan Perkara Catatan</label><input type="text" id="modal-perkara" placeholder="Taip perkara baharu di sini..."></div>
        <div class="form-group"><label>Nilai Mata Ganjaran/Denda</label><input type="number" id="modal-mata" placeholder="Contoh: 5" min="1"></div>
        <button class="btn btn-primary btn-block" onclick="submitCustomMeritForm()">Sahkan & Masukkan Rekod</button>
      </div>
    </div>`;
}

function submitCustomMeritForm() {
  const modul = document.getElementById('modal-modul').value;
  const jenis = document.getElementById('modal-jenis').value;
  const perkara = document.getElementById('modal-perkara').value.trim();
  let mata = parseFloat(document.getElementById('modal-mata').value);
  if(!perkara || isNaN(mata)) { alert('Sila isi maklumat perkara and mata dengan betul.'); return; }
  if(jenis === 'Demerit' && mata > 0) mata = -Math.abs(mata);
  closeModal();
  processAddMeritAction(modul, 'Input Pensyarah Khas', jenis, perkara, mata);
}

function renderLaporan() {
  document.getElementById('main-content').innerHTML = `
    <div class="card">
      <div class="card-title">Ringkasan Laporan Markah PB & Gred Pelajar MPU2082</div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Nama Pelajar</th><th>Kelas</th><th>Kuiz (10%)</th><th>HPK2 (60%)</th><th>HPK3 (30%)</th><th>Skor Akhir (100%)</th><th>Gred Akhir</th></tr></thead>
          <tbody>
            ${pelajarDBList.map(p => {
              const m = markahDB[p.nokp] || {};
              const k = parseFloat(m.kuiz)||0; const h4 = parseFloat(m.hp4)||0; const h5 = parseFloat(m.hp5)||0; const h3 = parseFloat(m.hp3)||0; const h8 = parseFloat(m.hp8)||0;
              const total = (k * 0.1) + (h4 * 0.3) + (h5 * 0.3) + (h3 * 0.15) + (h8 * 0.15);
              let gred = 'F'; if(total>=90) gred='A+'; else if(total>=80) gred='A'; else if(total>=75) gred='A-'; else if(total>=70) gred='B+'; else if(total>=65) gred='B'; else if(total>=40) gred='D';
              return `<tr><td>${p.nama}</td><td>${p.kelas}</td><td>${(k*0.1).toFixed(1)}%</td><td>${((h4*0.3)+(h5*0.3)).toFixed(1)}%</td><td>${((h3*0.15)+(h8*0.15)).toFixed(1)}%</td><td><b>${total.toFixed(2)}%</b></td><td><span class="gred-A">${gred}</span></td></tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
}
